[package]
name = "mediasort"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mediasort_lib"
# Desktop-only (Windows): the rlib is linked into the mediasort.exe binary.
# Mobile-only "staticlib"/"cdylib" are dropped — mobile isn't a target, and they
# also tripped MinGW's "export ordinal too large" back on the GNU toolchain.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
blake3 = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
kamadak-exif = "0.5"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
walkdir = "2.5.0"
trash = "5"

# WIC decode fallback (HEIC/HEIF previews + thumbnails) — pure-Rust bindings, no C toolchain.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Graphics_Imaging",
] }

[dev-dependencies]
tempfile = "3.27.0"

