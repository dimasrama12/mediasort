# Redirect Cargo's build output off the source tree onto D:.
#
# Keeps the multi-GB target directory off the tight C: drive and out of
# "D:\vibe coding\photosort" (so it never lands in git). Originally added because
# MinGW's dlltool/as split the space in the project path and broke GNU builds;
# the MSVC toolchain handles the space fine, but the redirect stays for the
# disk-space and clean-tree reasons above.
[build]
target-dir = "D:/mediasort-target"
